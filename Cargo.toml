[package]
name = "nerthus"
version = "0.1.0"
edition = "2021"
description = "Cross-platform 2D tile sandbox engine"
license = "MIT"

[dependencies]
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }

[[bin]]
name = "nerthus"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
