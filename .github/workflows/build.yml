name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The vendored SDL2 CMakeLists declares cmake_minimum_required(VERSION 3.0.0).
  # CMake 4 removed compatibility with < 3.5, so runners with CMake 4 fail to
  # configure. This restores the compatibility policy. Harmless on CMake 3.x.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: nerthus-linux-x86_64
            out: nerthus
          - os: ubuntu-24.04-arm
            name: linux-arm64
            artifact: nerthus-linux-arm64
            out: nerthus
          - os: macos-latest
            name: macos-universal
            artifact: nerthus-macos-universal
            out: nerthus
          - os: windows-latest
            name: windows-x86_64
            artifact: nerthus-windows-x86_64
            out: nerthus.exe
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # SDL2 is vendored (bundled feature) so no system SDL install is needed anywhere.
      - name: Build
        if: matrix.name != 'macos-universal'
        run: cargo build --release --locked

      # Real universal binary: build both slices, then lipo them together.
      - name: Build (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/nerthus \
            target/x86_64-apple-darwin/release/nerthus \
            -output target/release/nerthus
          lipo -info target/release/nerthus

      # Never publish a binary whose engine is not verified.
      - name: Selftest
        run: ./target/release/${{ matrix.out }} --selftest

      - name: Render reference frame
        run: ./target/release/${{ matrix.out }} --dump-frame frame.png --seed=424242

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="${{ matrix.artifact }}${{ matrix.ext }}"
          cp "target/release/${{ matrix.out }}" "dist/$name"
          chmod +x "dist/$name" || true
          cp frame.png "dist/$name-frame.png"
          cp README.md "dist/$name-README.md"
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 "$name" > "$name.sha256"
          else
            sha256sum "$name" > "$name.sha256"
          fi
          ls -la

      # macOS: also ship a real double-clickable .app bundle.
      - name: Build macOS .app bundle
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          bash packaging/make-macos-app.sh target/release/nerthus dist
          cd dist
          zip -qry nerthus-macos-universal.app.zip Nerthus.app
          rm -rf Nerthus.app
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        shell: bash
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
